name: Release

# Fires on the tag tag-release.yml pushes once the bot-maintained "Version
# Packages" PR merges, or via manual dispatch (recovering a failed release:
# `gh workflow run release.yml --ref v0.2.0`). create-release makes the
# GitHub Release compile.yml's attach-release step then uploads into —
# `gh release upload` never creates one — before the matching web deploy.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract this version's changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="## $version" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md

  compile:
    needs: create-release
    # TODO: pin to the v0.4.0 tag's commit once 8BitScript/8bitscript#89
    # merges and tags a release — this SHA is that PR's branch head, not a
    # release, and is here only so the rest of this workflow is reviewable.
    uses: 8BitScript/8bitscript/.github/workflows/compile.yml@21b4ad1b356f3eb6354791a830d91af59cb291a6 # v0.4.0 (pending)
    with:
      # No `targets`: compile.yml runs `8bs build --release`, which reads
      # this project's own 8bitscript.config.ts — the PET 4K/32K matrix and
      # the web build — so the release matrix lives in one place.
      cli-version: 0.4.0
      attach-release: true

  web:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec 8bs build --target web
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
