name: Release

# Fires on the tag tag-release.yml pushes once the bot-maintained "Version
# Packages" PR merges, or via manual dispatch (recovering a failed release:
# `gh workflow run release.yml --ref v0.2.0`). create-release makes the
# GitHub Release compile.yml's attach-release step then uploads into —
# `gh release upload` never creates one. There is no web deploy job here:
# Cloudflare Workers Builds watches this repo directly and deploys
# 2048.8bitscript.com itself on every push to trunk (`pnpm run build`,
# its own build, independent of this workflow) — see README.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Extract this version's changelog entry
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="## $version" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/release-notes.md

  compile:
    needs: create-release
    uses: 8BitScript/8bitscript/.github/workflows/compile.yml@f5741ae372209cfeebb9826d286cd09756559c2d # v0.6.1
    with:
      # No `targets`: compile.yml runs `8bs build --release`, which reads
      # this project's own 8bitscript.config.ts — the PET 4K/32K matrix and
      # the web build — so the release matrix lives in one place.
      cli-version: 0.4.0
      attach-release: true

  # The release is out — the GitHub Release exists and compile.yml has
  # attached every artifact 8bitscript.config.ts declares. Only now does
  # `release` move, and only to the commit this tag names.
  #
  # The branch answers what a tag cannot: what is actually downloadable
  # right now. A tag is written the moment the Version Packages PR merges,
  # before anything has been built or uploaded, so a run that fails halfway
  # leaves a tag standing over a release that does not exist. `needs` both
  # jobs above, so a failure in either leaves `release` where it was.
  #
  # Pushed without --force: git refuses anything that is not a
  # fast-forward, which is the check wanted rather than an obstacle. And
  # because this pushes with GITHUB_TOKEN, it fires no further workflows —
  # so nothing can be hung off `push: branches: [release]` and expected to
  # run.
  advance-release-branch:
    needs: [create-release, compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: git push origin "$GITHUB_SHA:refs/heads/release"
