name: Release

on:
  release:
    types: [published]

jobs:
  compile:
    uses: 8BitScript/8bitscript/.github/workflows/compile.yml@f2c05f69f81ff7d05d2bd6fd9f868d9bbdf9aa26 # v0.3.0
    with:
      # 0.3.x builds for pet and web only; the other machines return in a
      # later release (the compiler refuses them by name).
      targets: pet,web
      cli-version: 0.3.0
      attach-release: true

  web:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec 8bs build --target web
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
