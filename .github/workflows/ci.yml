name: CI

on:
  pull_request:
  push:
    branches: [trunk]

jobs:
  compile:
    uses: 8BitScript/8bitscript/.github/workflows/compile.yml@9a69c0e05ce3c6f545e5b22695b545d8888dab0b # v0.5.0
    with:
      # No `targets`: builds whatever 8bitscript.config.ts declares for a
      # release (both PET RAM tiers, plus web), so CI catches a variant
      # that stops fitting before a release does.
      cli-version: 0.4.0
