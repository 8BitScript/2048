name: CI

on:
  pull_request:
  push:
    branches: [trunk]

jobs:
  compile:
    # TODO: pin to the v0.4.0 tag's commit once 8BitScript/8bitscript#89
    # merges and tags a release — see release.yml for the same TODO.
    uses: 8BitScript/8bitscript/.github/workflows/compile.yml@21b4ad1b356f3eb6354791a830d91af59cb291a6 # v0.4.0 (pending)
    with:
      # No `targets`: builds whatever 8bitscript.config.ts declares for a
      # release (both PET RAM tiers, plus web), so CI catches a variant
      # that stops fitting before a release does.
      cli-version: 0.4.0
