name: CI

on:
  pull_request:
  push:
    branches: [trunk]

jobs:
  compile:
    uses: 8BitScript/8bitscript/.github/workflows/compile.yml@f5741ae372209cfeebb9826d286cd09756559c2d # v0.6.1
    with:
      # No `targets`: builds whatever 8bitscript.config.ts declares for a
      # release (both PET RAM tiers, plus web), so CI catches a variant
      # that stops fitting before a release does.
      cli-version: 0.4.0
