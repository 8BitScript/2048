name: CI

on:
  pull_request:
  push:
    branches: [trunk]

jobs:
  compile:
    uses: 8BitScript/8bitscript/.github/workflows/compile.yml@effb7a671539c871c147413da295d39880737455 # v0.2.5
    with:
      # 0.2.x builds for pet and web only; the other machines return in a
      # later release (the compiler refuses them by name).
      targets: pet,web
      cli-version: 0.2.5
