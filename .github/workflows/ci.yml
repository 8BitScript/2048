name: CI

on:
  pull_request:
  push:
    branches: [trunk]

jobs:
  compile:
    uses: 8BitScript/8bitscript/.github/workflows/compile.yml@1e6e43fb21bb7dd2aa38cdfc6fa9b4c123482ee3 # v0.6.2
    with:
      # No `targets`: builds whatever 8bitscript.config.ts declares for a
      # release (both PET RAM tiers, plus web), so CI catches a variant
      # that stops fitting before a release does.
      cli-version: 0.4.0
