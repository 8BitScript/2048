# esbuild and workerd belong to wrangler: workerd is the Workers runtime
# used by `wrangler dev`/`deploy`, and esbuild is its bundler. Their
# postinstall scripts unpack platform binaries, so without this the deploy
# script can't run.
allowBuilds:
  esbuild: true
  workerd: true
# Exact pins in the lockfile; 0.23.0 is hours old and the age check
# otherwise fails CI until every @8bitscript package is a day old.
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  # One name@version per line — `||` ranges and globs do not match the
  # lockfile age check. CLI 0.23.0 pulls every machine package.
  - '@8bitscript/apple2@0.23.0'
  - '@8bitscript/atari2600@0.23.0'
  - '@8bitscript/atari5200@0.23.0'
  - '@8bitscript/atari7800@0.23.0'
  - '@8bitscript/atari8@0.23.0'
  - '@8bitscript/audio-tools@0.23.0'
