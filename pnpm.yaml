# esbuild and workerd belong to wrangler: workerd is the Workers runtime
# used by `wrangler dev`/`deploy`, and esbuild is its bundler. Their
# postinstall scripts unpack platform binaries, so without this the deploy
# script can't run.
allowBuilds:
  esbuild: true
  workerd: true
# Own org: we publish these and pin them the same day. A version glob
# (`@8bitscript/*@0.23.0`) does not match; the scope glob does.
minimumReleaseAgeExclude:
  - '@8bitscript/*'
