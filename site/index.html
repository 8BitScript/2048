<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Deliberately NOT viewport-fit=cover, and deliberately NOT
     status-bar-style=black-translucent. Both exist to let a page draw
     UNDERNEATH the system UI, and both were doing exactly that: they extend
     the layout viewport above the visible area, so a `position: fixed`
     element at top: 0 starts behind Safari's landscape bar and the top of the
     picture is cut off. A letterboxed game gains nothing from drawing under
     the chrome — it just loses rows. Without `cover`, the layout viewport is
     the safe area and top: 0 is the top of what you can actually see. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>2048 — 8BitScript</title>
<style>
  :root { color-scheme: dark; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #000; color: #d7dae0;
    font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* The screen owns the whole visible viewport.
     `height: 100svh` is the SMALL viewport height — the height with the
     browser's retractable UI fully EXPANDED, i.e. the least screen this page
     will ever have. `dvh` tracks the bar sliding in and out, which means a
     picture sized to it overflows for as long as the bar is coming back;
     `svh` never overflows, and the cost is a little unused height while the
     bar is hidden. For a game that is the right side to err on.
     `height: 100%` is the fallback for anything that does not know svh.
     The safe-area padding is belt and braces: without viewport-fit=cover the
     insets report zero, and if anything ever puts that back the padding is
     already there.
     Deliberately NOT positioned from visualViewport.offsetTop: iOS reports
     that as 0 even when Safari's landscape bar is over the top of the layout
     viewport, so driving `top` from it anchors the picture above the visible
     area and the top of the board gets cut. */
  #game {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100%;
    height: 100svh;
    box-sizing: border-box;
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }

  /* Settings live on the edge, not in a bar across the top. A phone in
     landscape has no vertical pixels to give away, and the top strip is
     exactly where iOS puts its own chrome — so the thing that used to be a
     49px bar is now a handle that expands over the picture and gets out of
     the way again. Absolute, not fixed: #game is the visible box, so these
     inset from the part of the screen you can actually see. */
  #panel {
    position: absolute; z-index: 2;
    top: max(10px, env(safe-area-inset-top));
    left: max(10px, env(safe-area-inset-left));
    display: flex; align-items: flex-start; gap: 8px;
  }
  #handle {
    flex: none; width: 38px; height: 38px; padding: 0;
    display: grid; place-items: center;
    font: 17px/1 ui-sans-serif, system-ui, sans-serif;
    color: #9aa1ab; background: rgba(12, 14, 18, 0.66);
    border: 1px solid #262b33; border-radius: 10px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    cursor: pointer; touch-action: manipulation;
  }
  #handle:hover { color: #d7dae0; border-color: #39414d; }
  #handle:focus-visible { outline: 2px solid #5b8cff; outline-offset: 2px; }
  #panel.open #handle { color: #d7dae0; border-color: #39414d; background: rgba(12, 14, 18, 0.9); }

  #tray {
    display: flex; flex-direction: column; gap: 10px;
    padding: 12px 14px;
    background: rgba(12, 14, 18, 0.92); border: 1px solid #262b33;
    border-radius: 12px;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    transition: opacity .16s ease, transform .16s ease, visibility .16s;
  }
  #panel:not(.open) #tray {
    opacity: 0; visibility: hidden;
    transform: translateX(-8px) scale(0.97);
  }
  @media (prefers-reduced-motion: reduce) { #tray { transition: none; } }

  #tray strong { letter-spacing: 0.06em; color: #d7dae0; }
  /* Hidden with the tray. Here so a sizing problem on a device I cannot open
     a console on can be read off the screen instead of guessed at. */
  #diag {
    font: 10px/1.5 ui-monospace, Menlo, monospace;
    color: #6f7782; white-space: pre; border-top: 1px solid #262b33; padding-top: 8px;
  }
  label { display: flex; gap: 8px; align-items: center; justify-content: space-between; color: #9aa1ab; }
  select {
    background: #0b0d10; color: #d7dae0; border: 1px solid #262b33;
    border-radius: 6px; padding: 5px 8px; font: inherit;
  }
</style>
<script src="8bitscript.js"></script>
</head>
<body>
<div id="game">
  <div id="panel">
    <button id="handle" type="button" aria-expanded="false" aria-controls="tray" aria-label="Settings">
      <span aria-hidden="true">&#9881;</span>
    </button>
    <div id="tray" role="group" aria-label="Settings">
      <strong>2048</strong>
      <label for="system">System
        <select id="system">
          <option value="hifi">Modern</option>
          <option value="commodore">Commodore</option>
        </select>
      </label>
      <label id="model-wrap" for="model" hidden>Model
        <select id="model">
          <option value="c64">C64</option>
          <option value="pet-2001">PET 2001</option>
          <option value="vic20">VIC-20</option>
        </select>
      </label>
      <small id="diag" aria-live="polite"></small>
    </div>
  </div>
</div>
<script>
var game = document.getElementById('game');
var panel = document.getElementById('panel');
var handle = document.getElementById('handle');
var systemSelect = document.getElementById('system');
var modelSelect = document.getElementById('model');

// ---- what the page thinks its size is -------------------------------------
// Read this off the settings tray when the picture does not fit: whichever of
// these disagrees with the screen is the one lying.
var diag = document.getElementById('diag');
function report() {
  var vv = window.visualViewport;
  var rect = game.getBoundingClientRect();
  diag.textContent =
    'inner  ' + window.innerWidth + 'x' + window.innerHeight + '\n' +
    'client ' + document.documentElement.clientWidth + 'x' + document.documentElement.clientHeight + '\n' +
    (vv ? 'visual ' + Math.round(vv.width) + 'x' + Math.round(vv.height) +
          ' @' + Math.round(vv.offsetLeft) + ',' + Math.round(vv.offsetTop) + '\n' : 'visual  n/a\n') +
    'box    ' + Math.round(rect.width) + 'x' + Math.round(rect.height) +
          ' @' + Math.round(rect.left) + ',' + Math.round(rect.top);
}
window.addEventListener('resize', report);
window.addEventListener('orientationchange', report);
if (window.visualViewport) window.visualViewport.addEventListener('resize', report);

// ---- the settings tray ----------------------------------------------------
function setOpen(open) {
  panel.classList.toggle('open', open);
  handle.setAttribute('aria-expanded', open ? 'true' : 'false');
}
handle.addEventListener('click', function (e) {
  e.stopPropagation();
  setOpen(!panel.classList.contains('open'));
});
// A tap anywhere on the picture is a game move; it also puts the tray away.
game.addEventListener('pointerdown', function (e) {
  if (!panel.contains(e.target)) setOpen(false);
}, true);
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') setOpen(false);
});

// ---- the program ----------------------------------------------------------
var current = null;
function wasmSrc() {
  if (systemSelect.value === 'hifi') return 'program.wasm';
  return 'program-' + modelSelect.value + '.wasm';
}
function load() {
  var commodore = systemSelect.value === 'commodore';
  // Model is a Commodore idea: the modern host has no models to pick between.
  document.getElementById('model-wrap').hidden = !commodore;
  var src = wasmSrc();
  if (current) current.destroy();
  current = EightBitScript.mount('#game', {
    src: src,
    frameRate: 60,
    // Measured from the element, not from the viewport: #game is already
    // exactly the drawable area (100svh inside the safe-area insets), and an
    // element that says what it is beats a second guess at the same number.
    // The loader watches it with a ResizeObserver, so turning the phone
    // resizes the picture without anything here listening for it.
    //
    // `keyboard: 'window'` because the full-page default no longer applies:
    // the arrow keys belong to the game, and there is nothing else on this
    // page to focus.
    keyboard: 'window',
    fullscreen: true,
  });
}
systemSelect.addEventListener('change', load);
modelSelect.addEventListener('change', load);
load();
report();
</script>
</body>
</html>
